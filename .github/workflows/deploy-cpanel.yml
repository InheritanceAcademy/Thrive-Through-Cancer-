name: Deploy to domains.co.za cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload static site
    runs-on: ubuntu-latest
    env:
      CPANEL_FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
      CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      - name: Build static export
        run: npm run build

      - name: Check deployment secrets
        if: env.CPANEL_FTP_SERVER == '' || env.CPANEL_FTP_USERNAME == '' || env.CPANEL_FTP_PASSWORD == ''
        run: |
          echo "cPanel FTP secrets are not configured yet. Static build completed, upload skipped."
          echo "Add CPANEL_FTP_SERVER, CPANEL_FTP_USERNAME and CPANEL_FTP_PASSWORD in GitHub repository secrets."

      - name: Upload to cPanel
        if: env.CPANEL_FTP_SERVER != '' && env.CPANEL_FTP_USERNAME != '' && env.CPANEL_FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CPANEL_FTP_SERVER }}
          username: ${{ env.CPANEL_FTP_USERNAME }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
