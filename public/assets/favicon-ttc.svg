<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Subtle background gradient for depth -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A1714"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </radialGradient>
    
    <!-- Soft shadow for the leaves to separate them from the background -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Crisp shadow for the text to ensure perfect contrast -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style><![CDATA[
/* Subtle organic breathing animation for the leaves */
    .leaf-pair {
      transform-origin: 16px 29px;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
]]></style>

  <!-- Dark Background -->
  <rect width="32" height="32" fill="url(#bgGrad)" rx="6"/>

  <!-- Symmetrical Overlapping Leaves -->
  <g class="leaf-pair" filter="url(#leafShadow)">
    <!-- Left Leaf -->
    <path d="M 16 29 C 6 25, 2 12, 8 3 C 14 8, 17 18, 16 29 Z" 
          fill="#2D6A4F" 
          stroke="#52B788" 
          stroke-width="1.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
          
    <!-- Right Leaf -->
    <path d="M 16 29 C 26 25, 30 12, 24 3 C 18 8, 15 18, 16 29 Z" 
          fill="#2D6A4F" 
          stroke="#52B788" 
          stroke-width="1.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Centered Typography -->
  <text x="16" y="16.5" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="9" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="#FFFFFF" 
        letter-spacing="0.2" 
        filter="url(#textShadow)">TTC</text>
</svg>